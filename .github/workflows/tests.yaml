name: tests

on:
  push:
    branches:
      - main
  pull_request: null

env:
  PY_COLORS: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  tests:
    name: tests
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          condarc: |
            channels:
              - conda-forge
            show_channel_urls: true
            channel_priority: strict
          environment-file: environment.yml
          environment-name: seacliff

      - name: install code
        run: |
          python -m pip install --no-deps --no-build-isolation -e .

      - name: run tests
        run: |
          pytest -n 2 -vv --cov=seacliff --cov-report=term-missing --cov-report=xml tests

      - name: upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v.5.52
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
